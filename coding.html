<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Hub - Coding</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #030712;
            color: #f3f4f6;
            font-family: system-ui, sans-serif;
            padding-top: 100px;
        }
        nav {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(3, 7, 18, 0.7); backdrop-filter: blur(12px);
            padding: 20px; display: flex; justify-content: center; gap: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000;
        }
        nav a { color: #9ca3af; text-decoration: none; font-weight: 500; }
        nav a:hover { color: #60a5fa; }
        
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #c084fc; font-size: 2.5rem; text-align: center; }
        
        /* List Kartu Berwarna Gradasi Canggih */
        .tech-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }
        .tech-card {
            background: linear-gradient(rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .tech-card:hover {
            border-color: #c084fc;
            box-shadow: inset 0 0 20px rgba(192, 132, 252, 0.1), 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: scale(1.02);
        }
        .badge {
            background: rgba(192, 132, 252, 0.1);
            color: #c084fc;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">🏠 Beranda</a>
        <a href="coding.html" style="color: #c084fc; text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);">💻 Info Coding</a>
        <a href="karir.html">🚀 Karir IT</a>
    </nav>

    <div class="container">
        <h1>Arsitektur Kode & Bahasa</h1>
        <div class="tech-stack">
            <div class="tech-card">
                <div>
                    <h3 style="margin:0 0 10px 0;">Python Language</h3>
                    <p style="margin:0; color:#9ca3af;">Digunakan oleh Google dan NASA untuk kecerdasan buatan.</p>
                </div>
                <span class="badge">Sangat Populer</span>
            </div>
            <div class="tech-card">
                <div>
                    <h3 style="margin:0 0 10px 0;">Fullstack JavaScript</h3>
                    <p style="margin:0; color:#9ca3af;">Membuat aplikasi mobile, desktop, dan website interaktif.</p>
                </div>
                <span class="badge">Interaktif</span>
            </div>
        </div>
    </div>

</body>
</html>
