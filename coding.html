<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Hub - Coding</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #030712;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            padding-top: 100px;
        }
        
        /* Tombol Kembali Minimalis & Elegan */
        .back-nav {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 1000;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            color: #c084fc;
            border-color: rgba(192, 132, 252, 0.4);
            background: rgba(192, 132, 252, 0.05);
            transform: translateX(-3px);
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.2);
        }
        
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { 
            color: #c084fc; 
            font-size: 2.5rem; 
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(192, 132, 252, 0.2);
        }
        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 40px;
        }
        
        /* List Kartu Berwarna Gradasi Canggih */
        .tech-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .tech-card {
            background: linear-gradient(rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .tech-card:hover {
            border-color: #c084fc;
            box-shadow: inset 0 0 20px rgba(192, 132, 252, 0.1), 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: scale(1.02);
        }
        .badge {
            background: rgba(192, 132, 252, 0.1);
            color: #c084fc;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Navigasi Tombol Balik Saja -->
    <div class="back-nav">
        <a href="index.html" class="btn-back">← Kembali</a>
    </div>

    <div class="container">
        <h1>Arsitektur Kode & Bahasa</h1>
        <p class="subtitle">Eksplorasi bahasa pemrograman terbaik untuk masa depan digital Anda</p>
        
        <div class="tech-stack">
            <div class="tech-card">
                <div>
                    <h3 style="margin:0 0 10px 0;">Python Language</h3>
                    <p style="margin:0; color:#9ca3af;">Digunakan oleh Google dan NASA untuk kecerdasan buatan.</p>
                </div>
                <span class="badge">Sangat Populer</span>
            </div>
            <div class="tech-card">
                <div>
                    <h3 style="margin:0 0 10px 0;">Fullstack JavaScript</h3>
                    <p style="margin:0; color:#9ca3af;">Membuat aplikasi mobile, desktop, dan website interaktif.</p>
                </div>
                <span class="badge">Interaktif</span>
            </div>
        </div>
    </div>

</body>
</html>
