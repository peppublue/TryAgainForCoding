<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesial Buat Kamu</title>
    <style>
        /* Mengatur latar belakang hitam pekat dan elemen di tengah */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Wadah untuk menampung animasi Love */
        .heart-container {
            position: relative;
            width: 100px;
            height: 90px;
            animation: degup 0.8s infinite alternate cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: drop-shadow(0 0 20px #ff2a74) drop-shadow(0 0 40px #ff2a74);
            cursor: pointer;
        }

        /* Membuat bentuk hati dengan teknik CSS Pseudo-elements */
        .heart-container::before,
        .heart-container::after {
            content: "";
            position: absolute;
            top: 0;
            width: 50px;
            height: 80px;
            background: linear-gradient(to bottom, #ff2a74, #ff0040);
            border-radius: 50px 50px 0 0;
        }

        .heart-container::before {
            left: 50px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart-container::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100%;
        }

        /* Animasi Jantung Berdegup (Heartbeat) */
        @keyframes degup {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.25);
            }
        }

        /* Teks Elegan di Bawah Hati */
        .pesan {
            margin-top: 50px;
            color: #ffffff;
            font-size: 1.3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            opacity: 0;
            animation: munculTeks 2s ease forwards 0.5s;
        }

        @keyframes munculTeks {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Elemen Animasi Hati -->
    <div class="heart-container" onclick="tambahEfek()"></div>

    <!-- Elemen Teks -->
    <div class="pesan" id="teks">Bukan PHP, Ini Keajaiban CSS!</div>

    <script>
        // Efek interaktif opsional jika hati diketuk di layar tablet
        function tambahEfek() {
            const teks = document.getElementById('teks');
            teks.innerText = "❤️ CODE WITH LOVE ❤️";
            teks.style.color = "#ff2a74";
            teks.style.textShadow = "0 0 15px #ff2a74";
        }
    </script>
</body>
</html>
